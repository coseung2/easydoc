name: Upstream GenOffice Sync

on:
  schedule:
    # Daily at 03:17 UTC (12:17 Asia/Seoul).
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-genoffice-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_URL: https://github.com/genspark-ai/genoffice.git
      SYNC_BRANCH: automation/genoffice-upstream-sync
      CONFLICT_ISSUE_TITLE: GenOffice upstream sync requires manual resolution
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch GenOffice upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune upstream main

      - name: Check for upstream changes
        id: changes
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New GenOffice upstream commits detected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge upstream into automation branch
        if: steps.changes.outputs.needed == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" origin/main
          set +e
          git merge --no-ff --no-edit upstream/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "Upstream merge has conflicts and needs manual resolution." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict
        if: steps.changes.outputs.needed == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$CONFLICT_ISSUE_TITLE\" in:title" \
            --json number \
            --jq '.[0].number // empty')
          body="Automated merge of genspark-ai/genoffice main into this fork failed with conflicts.\n\nUpstream: $(git rev-parse upstream/main)\nFork main: $(git rev-parse origin/main)\nWorkflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$CONFLICT_ISSUE_TITLE" --body "$body"
          fi
          exit 1

      - name: Push sync branch
        if: steps.changes.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        run: git push --force origin HEAD:"$SYNC_BRANCH"

      - name: Create or update sync pull request
        if: steps.changes.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          body="Automated thin-fork sync from genspark-ai/genoffice.\n\nUpstream commit: ${{ steps.merge.outputs.upstream_sha }}\n\nCI is dispatched explicitly for the sync branch. Merge only after CI passes and the EasyDoc shell integration remains intact."
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync GenOffice upstream" \
              --body "$body"
          fi

      - name: Dispatch CI for sync branch
        if: steps.changes.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"

      - name: Close resolved conflict issue
        if: steps.changes.outputs.needed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$CONFLICT_ISSUE_TITLE\" in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment "Automated upstream merge is clean again."
          fi
